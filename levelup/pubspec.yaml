name: levelup
description: "A well-organized Flutter project."
publish_to: 'none' # Private project, not published to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.1.2
  json_annotation: ^4.8.0
  get_it: ^8.0.3
  flutter_localizations:
    sdk: flutter
  go_router: ^14.6.2
  flutter_bloc: ^8.1.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  equatable: ^2.0.7
  freezed_annotation: ^3.1.0
  crypto: ^3.0.6
  path: ^1.9.0
  package_info_plus: ^8.0.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.7.0
  feature_folder_cli: ^0.3.0
  hive_generator: ^2.0.1
  freezed: ^3.0.0-0.0.dev
  # Testing dependencies
  mockito: ^5.4.4
  bloc_test: ^9.1.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/