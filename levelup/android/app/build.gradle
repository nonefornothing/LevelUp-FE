plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin" // Flutter plugin must be after Android and Kotlin
}

android {
    namespace = "tech.johanambarita.levelup"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    // Updated Java compatibility for Java 17
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Set Kotlin JVM target to Java 17
    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "tech.johanambarita.levelup"
        minSdk = flutter.minSdkVersion // Ensure dependencies match this
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Ensure signing config is properly set for release builds
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
}

